<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UF WebSocket Chat </title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container py-4">
    <h2 class="text-center mb-4">🗨️ UF Real-Time Ch</h2>

    <div class="card shadow chat-box">
      <div id="chat-window" class="card-body overflow-auto">
        <ul id="messages" class="list-unstyled mb-0"></ul>
      </div>
    </div>

    <div class="mt-3">
      <input id="handle" class="form-control mb-2" placeholder="Enter your name..." />
      <div class="input-group">
        <input id="message" class="form-control" placeholder="Type a message..." />
        <button id="send" class="btn btn-primary">Send</button>
        <button id="ask-ollama" class="btn btn-outline-dark">Ask Ollama</button>
      </div>
      <p id="feedback" class="text-muted mt-2"></p>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/toxicity"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="/config.js"></script>
  <script src="chat.js"></script>
</body>
</html>
